<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ticarena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="screen"><div class="loading">Loading…</div></div>

    <nav id="bottom-nav">
      <button class="nav-btn" data-route="home">
        <span class="nav-icon">🏠</span><span>Home</span>
      </button>
      <button class="nav-btn" data-route="play">
        <span class="nav-icon">🎮</span><span>Play</span>
      </button>
      <button class="nav-btn" data-route="friends">
        <span class="nav-icon">👥</span><span>Friends</span>
      </button>
      <button class="nav-btn" data-route="wallet">
        <span class="nav-icon">💰</span><span>Wallet</span>
      </button>
      <button class="nav-btn" data-route="profile">
        <span class="nav-icon">👤</span><span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
